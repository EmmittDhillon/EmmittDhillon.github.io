<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Knowledge OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">K</div>
        <div><strong>Knowledge OS</strong><span>Personal command center</span></div>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-section="home">⌂ <span>Dashboard</span></button>
        <button class="nav-item" data-section="inbox">↓ <span>Inbox</span><b id="inboxCount">3</b></button>
        <button class="nav-item" data-section="medicine">✚ <span>Medicine</span></button>
        <button class="nav-item" data-section="finance">$ <span>Finance</span></button>
        <button class="nav-item" data-section="career">↗ <span>Career</span></button>
        <button class="nav-item" data-section="projects">◆ <span>Projects</span></button>
        <button class="nav-item" data-section="knowledge">◇ <span>Knowledge</span></button>
        <button class="nav-item" data-section="life">○ <span>Life</span></button>
        <button class="nav-item" data-section="resources">▤ <span>Resources</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-section="settings">⚙ <span>Settings</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="mobileMenu" class="icon-btn">☰</button>
        <div class="search-wrap">
          <span>⌕</span>
          <input id="search" type="search" placeholder="Search your knowledge...">
          <kbd>⌘ K</kbd>
        </div>
        <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
        <button class="avatar">E</button>
      </header>

      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
